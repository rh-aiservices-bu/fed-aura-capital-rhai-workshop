# Per-user (tenant) resources -- installed AFTER bootstrap-infra, once the number
# of workshop users is known. Creates one ArgoCD ApplicationSet per component,
# fanned out over user1..userN into namespace <namespacePrefix>-<user>.
#
# Values marked "injected" are overridden per environment from
# agd_v2/rhai-features-workshop/common.yaml -- see gitops/README.md.

bootstrap:
  repoURL: https://github.com/rh-aiservices-bu/fed-aura-capital-rhai-workshop
  targetRevision: main
  # Use "automation/gitops" when this tree is hosted in rhai-features-workshop.
  pathPrefix: gitops
  argoNamespace: openshift-gitops
  project: default

# Cluster coordinates (injected). deployer.domain builds the mortgage-ai routes.
deployer:
  apiUrl: https://api.cluster-guid.sandbox.opentlc.com:6443
  domain: apps.cluster-guid.sandbox.opentlc.com

# Workshop users -> namespaces wksp-user1 .. wksp-userN (injected).
user:
  count: 1
  prefix: user
  namespacePrefix: wksp

# Remote LLM / MaaS credentials (injected).
remotellm:
  enabled: true
  url: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  id: "gpt-oss-120b"
  apiToken: "paste-your-token-here"

# Per-user MinIO credentials (injected).
minio:
  rootUser: minio
  rootPassword: "paste-your-password-here"

# Register the in-cluster TinyLlama endpoint as an extra OGX inference provider.
# Set to true only when the bootstrap-infra llmd component is enabled.
tinyllama:
  enabled: false

components:
  # Namespace + injected LLM credentials (wave 5). Required by everything below.
  workspace:
    enabled: true
  # Object store + RHOAI data connections (wave 6).
  minio:
    enabled: true
  # Data Science Pipelines (wave 7).
  dspa:
    enabled: true
  # AutoML training bucket + dataset upload (wave 7).
  automl:
    enabled: true
  # vLLM CPU model serving per user (wave 7). One pod per enabled model per user
  # (4-8 cores, 8-16Gi each) -- keep off unless the cluster is sized for it.
  modelCatalog:
    enabled: false
  # OGX / llama-stack playground + PGVector (wave 8).
  ogx:
    enabled: true
  # Multi-agent mortgage application (wave 9).
  mortgageAi:
    enabled: true
    # Chart is reused from the repo root, shared with the standalone install.
    chartPath: deployments/mortgage-ai
    uiImageTag: "latest"
    seed: true
