# This project was developed with assistance from AI tools.
{{- if and .Values.mlflow.rbac.enabled (not (dig "mlflow" "autoManaged" false .Values.kagenti)) }}
---
# MLflow integration ClusterRole for RHOAI 3.4+ MLflow server access.
# This ClusterRole grants permissions to interact with MLflow CRDs
# (experiments, datasets, registered models, gateway endpoints).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-integration
  labels:
    {{- include "mortgage-ai.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - mlflow.kubeflow.org
    resources:
      - datasets
      - experiments
      - registeredmodels
    verbs:
      - get
      - list
      - create
      - update
  - apiGroups:
      - mlflow.kubeflow.org
    resources:
      - gatewayendpoints
    verbs:
      - get
      - list
  - apiGroups:
      - mlflow.kubeflow.org
    resources:
      - gatewayendpoints/use
    verbs:
      - create
---
# ServiceAccount for MLflow client operations.
# Used by the API pod to authenticate with the MLflow server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mortgage-ai.labels" . | nindent 4 }}
---
# Long-lived token for the MLflow client ServiceAccount.
#
# The API authenticates to the RHOAI MLflow server with a Bearer token, and the
# server rejects anonymous calls with 401. The projected token at
# /var/run/secrets/kubernetes.io/serviceaccount/token cannot be referenced from an
# env var, and MLFLOW_TRACKING_AUTH=kubernetes is not a registered provider in the
# application image, so a Secret-backed token is what makes tracing work.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-client-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ include "mortgage-ai.fullname" . }}-mlflow-client
  labels:
    {{- include "mortgage-ai.labels" . | nindent 4 }}
type: kubernetes.io/service-account-token

---
# ClusterRoleBinding to grant the mlflow-client ServiceAccount
# the mlflow-integration ClusterRole permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-integration
  labels:
    {{- include "mortgage-ai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: {{ include "mortgage-ai.fullname" . }}-mlflow-client
    namespace: {{ .Release.Namespace }}
{{- if .Values.mlflow.rbac.pipelineRunner.enabled }}
---
# ClusterRoleBinding to grant the DSPA pipeline-runner ServiceAccount
# the mlflow-integration ClusterRole, so KFP pipeline pods can
# authenticate to MLflow using their auto-mounted SA token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mortgage-ai.fullname" . }}-pipeline-runner-mlflow
  labels:
    {{- include "mortgage-ai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mortgage-ai.fullname" . }}-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: {{ .Values.mlflow.rbac.pipelineRunner.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
