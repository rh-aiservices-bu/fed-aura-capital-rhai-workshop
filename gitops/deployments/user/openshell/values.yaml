# Per-user OpenShell sandbox provisioning.
#
# Assumes the OpenShell gateway is already running in this namespace (service
# "openshell" on 8080). The Job talks to it over in-cluster DNS - no port-forward,
# so there is no background process to die, and no pods/portforward RBAC needed.
username: user1
namespacePrefix: wksp

sandbox:
  name: fedaura-opencode
  # Bumping this re-runs provisioning on every user. The marker file inside the
  # sandbox records the version that last completed, so an unchanged version is a
  # no-op and a changed one converges.
  provisionVersion: "3"
  # The base image already ships opencode and node, so nothing is installed from
  # a package registry at provisioning time. Set to "" to use the gateway default.
  image: ""

ocpAppsDomain: ""

gateway:
  # In-cluster service. Kept as a value so a shared gateway can be pointed at.
  endpoint: http://openshell:8080
  name: openshift

# Image for the Job. Contains openshell, kubectl, oc and python3.
job:
  image: quay.io/rh-aiservices-bu/fedaura-codeserver:1.3
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Injected from bootstrap-infra (remotellm.*). Written into a Secret and consumed
# by the Job, never baked into the image or the ConfigMap.
llm:
  baseUrl: ""
  apiKey: ""
  model: ""

# Lets the workbench read the policy ConfigMap for section 5.3. Without it the
# exercise cannot fetch the policies and the participant sees a Forbidden error.
workbenchRbac:
  enabled: true

mlflow:
  enabled: true
  experiment: opencode-sandbox
