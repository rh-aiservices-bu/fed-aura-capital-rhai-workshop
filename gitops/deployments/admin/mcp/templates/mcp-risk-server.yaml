{{- if .Values.riskServer.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-risk-server
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-risk-server
    app.kubernetes.io/name: mcp-risk-server
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-risk-server
  template:
    metadata:
      labels:
        app: mcp-risk-server
    spec:
      securityContext: {}
      containers:
        - name: mcp-risk-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          image: {{ .Values.riskServer.image }}
          imagePullPolicy: Always
          command: ["python", "-m", "src.mcp_server"]
          ports:
            - name: http
              containerPort: {{ .Values.riskServer.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-risk-server
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-risk-server
    app.kubernetes.io/name: mcp-risk-server
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.riskServer.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mcp-risk-server
{{- end }}
