---
kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  annotations:
    opendatahub.io/notebook-image-desc: >-
      Custom Code Server workbench for FedAura Capital workshop.
      Includes OpenCode, OpenShell CLI, MLflow tracing, and evaluation tools.
    opendatahub.io/notebook-image-name: "FedAura Capital - Custom Code Server"
    opendatahub.io/notebook-image-url: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    opendatahub.io/recommended-accelerators: "[]"
  name: fedaura-custom-code-server
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/created-by: byon
    opendatahub.io/dashboard: "true"
    opendatahub.io/notebook-image: "true"
spec:
  lookupPolicy:
    local: true
  tags:
    - name: {{ .Values.image.tag | quote }}
      annotations:
        opendatahub.io/notebook-python-dependencies: >-
          [{"name":"openai","version":"latest","visible":true},
           {"name":"ragas","version":"latest","visible":true},
           {"name":"langchain-community","version":"latest","visible":true},
           {"name":"mlflow","version":"3.14","visible":true}]
        opendatahub.io/notebook-software: >-
          [{"name":"OpenCode","version":"1.37.1","visible":true},
           {"name":"OpenShell CLI","version":"0.0.116","visible":true},
           {"name":"Python","version":"3.12","visible":true},
           {"name":"Code Server","version":"4.106","visible":true}]
        openshift.io/imported-from: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      from:
        kind: DockerImage
        name: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source
