{{- if .Values.workbenchRbac.enabled }}
{{- $ns := include "workshop.namespace" . }}
# A workbench ServiceAccount cannot read ConfigMaps in its own namespace by
# default, so section 5.3 could not fetch the sandbox policies. Granting it here
# keeps the setup invisible to the participant: no oc adm, no cluster-scoped
# permission, and read-only on named ConfigMaps rather than the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workbench-read-openshell-config
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames:
      - openshell-provision
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workbench-read-openshell-config
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workbench-read-openshell-config
subjects:
  # Any workbench in the namespace, so it holds whatever the user names theirs.
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts:{{ $ns }}
{{- end }}
