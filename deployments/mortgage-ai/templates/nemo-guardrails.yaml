{{- if .Values.nemoGuardrails.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nemo-guardrails-api-key
  labels:
    {{- include "mortgage-ai.nemo-guardrails.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ (.Values.nemoGuardrails.llm.apiKey | default .Values.secrets.LLM_API_KEY) | toString | b64enc | quote }}
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemo-guardrails
  annotations:
    # Must stay 'true'. With 'false' the operator exposes the nemo-guardrails Service as
    # plain HTTP on port 80 and omits the kube-rbac-proxy sidecar, but the GenAI Playground
    # BFF always posts to https://nemo-guardrails.<ns>.svc.cluster.local:443/v1/guardrail/checks
    # with the user token. Nothing listens on 443, so every check hangs until the BFF client
    # timeout and the Playground reports "[guardrail_service_unavailable]".
    # The mortgage-ai API is unaffected either way: it talks to nemo-guardrails-internal:8000.
    security.opendatahub.io/enable-auth: 'true'
  labels:
    {{- include "mortgage-ai.nemo-guardrails.labels" . | nindent 4 }}
spec:
  nemoConfigs:
    - name: nemo-guardrails-config
      configMaps:
        - nemo-guardrails-config
  env:
    - name: "OPENAI_API_KEY"
      valueFrom:
        secretKeyRef:
          name: "nemo-guardrails-api-key"
          key: "token"
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-guardrails-internal
  labels:
    {{- include "mortgage-ai.nemo-guardrails.labels" . | nindent 4 }}
spec:
  selector:
    app: nemo-guardrails
    component: nemo-guardrails
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  type: ClusterIP
{{- end }}
