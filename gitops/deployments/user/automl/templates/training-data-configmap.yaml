---
# Training dataset shipped with the chart and uploaded to MinIO by the setup Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: automl-training-data
  namespace: {{ include "workshop.namespace" . }}
  labels:
    app: automl
data:
  {{ .Values.dataFile }}: |-
{{ .Files.Get (printf "files/%s" .Values.dataFile) | indent 4 }}
