{{- if .Values.serviceConfig.enabled }}
---
# Do NOT set command/args here - the preset template (v3-5-0-kserve-config-llm-template)
# provides a bash script that handles TLS conditionally. Overriding it breaks health probes.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceServiceConfig
metadata:
  name: {{ .Values.serviceConfig.name }}
  namespace: {{ .Values.dashboardNamespace }}
  annotations:
    opendatahub.io/runtime-version: {{ .Values.serviceConfig.runtimeVersion | quote }}
    opendatahub.io/supported-topologies: '["workload-single-node"]'
    openshift.io/description: vLLM CPU (x86) LLMInferenceServiceConfig Single Node for LLMInferenceService.
    openshift.io/display-name: vLLM CPU (x86) LLMInferenceServiceConfig Single Node
  labels:
    opendatahub.io/config-type: accelerator
    opendatahub.io/dashboard: "true"
spec:
  model:
    uri: ""
  template:
    containers:
      - name: main
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "4"
        image: {{ .Values.serviceConfig.image }}
        resources: {}
{{- end }}
