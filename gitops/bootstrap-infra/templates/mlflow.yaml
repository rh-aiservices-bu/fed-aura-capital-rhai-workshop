{{- if .Values.components.mlflow.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-mlflow
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.bootstrap.project }}
  destination:
    name: in-cluster
    namespace: redhat-ods-applications
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: {{ include "bootstrap.path" (dict "ctx" . "chart" "admin/mlflow") }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
