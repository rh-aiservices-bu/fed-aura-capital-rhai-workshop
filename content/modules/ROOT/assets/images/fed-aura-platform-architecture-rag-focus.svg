<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Fed Aura Capital architecture with RAG highlighted</title>
  <desc id="desc">The complete Lenora AI platform is dimmed except for the RAG trusted-knowledge layer containing PostgreSQL, pgvector, compliance knowledge-base embeddings, and policy documents.</desc>
  <defs>
    <mask id="spotlight-mask">
      <rect width="1400" height="850" fill="white"/>
      <rect x="458" y="478" width="394" height="220" rx="24" fill="black"/>
    </mask>
    <filter id="focus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#3e8635" flood-opacity="0.7"/>
    </filter>
  </defs>

  <image href="fed-aura-platform-architecture.svg" xlink:href="fed-aura-platform-architecture.svg" width="1400" height="850"/>
  <rect width="1400" height="850" fill="#151515" opacity="0.6" mask="url(#spotlight-mask)"/>

  <g id="rag-focus" font-family="RedHatText, 'Red Hat Text', Arial, sans-serif">
    <rect x="460" y="480" width="390" height="216" rx="22" fill="none" stroke="#3e8635" stroke-width="7" filter="url(#focus-shadow)"/>
    <rect x="502" y="694" width="306" height="66" rx="33" fill="#3e8635"/>
    <text x="655" y="721" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">MODULE 5 FOCUS · RAG</text>
    <text x="655" y="743" text-anchor="middle" font-size="14" fill="#ffffff">Retrieve · ground · cite trusted documents</text>
  </g>
</svg>
