{{- if .Values.remotellm.enabled }}
---
# Injected LLM/MaaS credentials for the user's workspace.
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  namespace: {{ include "workshop.namespace" . }}
  labels:
    app.kubernetes.io/component: llm-credentials
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.remotellm.apiToken | quote }}
  LLM_BASE_URL: {{ .Values.remotellm.url | quote }}
  LLM_MODEL: {{ .Values.remotellm.id | quote }}
{{- end }}
