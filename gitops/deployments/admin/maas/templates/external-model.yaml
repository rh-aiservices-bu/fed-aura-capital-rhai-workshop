---
# API key for the external provider -- injected, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.model.name }}-api-key
  namespace: {{ .Values.namespaces.externalModels }}
  labels:
    inference.llm-d.ai/ipp-managed: "true"
    inference.networking.k8s.io/bbr-managed: "true"
type: Opaque
stringData:
  api-key: {{ .Values.model.apiKey | quote }}
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  provider: openai
  endpoint: {{ .Values.model.endpoint }}
  auth:
    type: apikey
    secretRef:
      name: {{ .Values.model.name }}-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  targetModel: {{ .Values.model.name }}
  externalProviderRefs:
    - ref:
        name: {{ .Values.model.name }}
      apiFormat: {{ .Values.model.apiFormat }}
      path: {{ .Values.model.path }}
      targetModel: {{ .Values.model.name }}
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ .Values.model.name }}
  namespace: {{ .Values.namespaces.externalModels }}
spec:
  modelRef:
    kind: ExternalModel
    name: {{ .Values.model.name }}
