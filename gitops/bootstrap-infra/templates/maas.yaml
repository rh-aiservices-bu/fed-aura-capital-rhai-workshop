{{- if .Values.components.maas.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-maas
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.bootstrap.project }}
  destination:
    name: in-cluster
    namespace: external-models
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: {{ include "bootstrap.path" (dict "ctx" . "chart" "admin/maas") }}
    helm:
      valuesObject:
        model:
          name: {{ .Values.remotellm.id | quote }}
          endpoint: {{ .Values.remotellm.endpoint | quote }}
          apiKey: {{ .Values.remotellm.apiToken | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
