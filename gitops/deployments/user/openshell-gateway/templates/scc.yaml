{{- if .Values.scc.enabled }}
{{- $ns := include "workshop.namespace" . }}
# Equivalent of: oc adm policy add-scc-to-user privileged -z openshell-sandbox
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-sandbox-privileged-scc
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: {{ .Values.scc.serviceAccount }}
    namespace: {{ $ns }}
{{- end }}
