username: user1
namespacePrefix: wksp

serverName: lsd-genai-playground

# Remote LLM / MaaS provider, injected from agnosticv (bootstrap-infra remotellm.*).
remotellm:
  enabled: true
  url: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  id: "gpt-oss-120b"
  apiToken: "REPLACE_ME"

# Optional in-cluster TinyLlama served by the admin/llmd chart.
tinyllama:
  enabled: false
  baseUrl: "https://tinyllama-kserve-workload-svc.llm.svc.cluster.local:8000/v1"
  maxTokens: 2048

pgvector:
  enabled: true
  image: registry.redhat.io/rhel9/postgresql-16
  database: vectordb
  user: vectoruser
  password: "pgvector123"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

embeddingModel: ibm-granite/granite-embedding-125m-english
embeddingDimension: 768

# RHOAI dashboard connection secret pointing at the OGX server (used by AutoRAG).
connection:
  enabled: true
  name: my-ogx
  apiKey: "REPLACE_ME"

server:
  replicas: 1
  port: 8321
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: "2"
      memory: 12Gi
