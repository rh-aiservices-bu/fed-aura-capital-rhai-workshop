{{- $ns := include "workshop.namespace" . }}
{{- range .Values.models }}
{{- if .enabled }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  annotations:
    opendatahub.io/kserve-runtime: vllm
    opendatahub.io/apiProtocol: REST
    opendatahub.io/template-display-name: {{ .runtimeDisplayName | quote }}
    opendatahub.io/template-name: {{ .templateName }}
    openshift.io/display-name: {{ .runtimeDisplayName | quote }}
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  containers:
    - args:
        - '--port=8080'
        - '--model=/mnt/models'
        # {{ "{{.Name}}" }} is substituted by KServe, not by Helm.
        - '--served-model-name={{ "{{.Name}}" }}'
        - '--max-model-len={{ $.Values.maxModelLen }}'
      command:
        - python
        - '-m'
        - vllm.entrypoints.openai.api_server
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_CPU_KVCACHE_SPACE
          value: {{ $.Values.kvCacheSpace | quote }}
      image: {{ $.Values.runtimeImage }}
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
{{- end }}
{{- end }}
