kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  annotations:
    opendatahub.io/notebook-image-desc: >-
      Custom Code Server workbench for FedAura Capital workshop.
      Includes OpenCode, OpenShell CLI, MLflow tracing, and evaluation tools.
    opendatahub.io/notebook-image-name: "FedAura Capital - Custom Code Server"
    opendatahub.io/notebook-image-url: "quay.io/rh-aiservices-bu/fedaura-codeserver:1.5"
    opendatahub.io/recommended-accelerators: "[]"
  name: fedaura-custom-code-server
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/created-by: byon
    opendatahub.io/dashboard: "true"
    opendatahub.io/notebook-image: "true"
spec:
  lookupPolicy:
    local: true
  tags:
    - name: "1.5"
      annotations:
        opendatahub.io/notebook-python-dependencies: >-
          [{"name":"mlflow","version":"3.14.0","visible":true},
           {"name":"sentence-transformers","version":"6.2.0","visible":true},
           {"name":"torch","version":"2.15.0+cpu","visible":true},
           {"name":"langchain","version":"1.4.3","visible":true},
           {"name":"langgraph","version":"1.2.12","visible":true},
           {"name":"ragas","version":"0.4.3","visible":true},
           {"name":"eval-hub-sdk","version":"0.4.4","visible":true},
           {"name":"openai","version":"1.109.1","visible":true}]
        opendatahub.io/notebook-software: >-
          [{"name":"OpenCode","version":"1.17.1","visible":true},
           {"name":"OpenShell CLI","version":"0.0.116","visible":true},
           {"name":"Python","version":"3.12","visible":true},
           {"name":"Code Server","version":"4.106","visible":true}]
        openshift.io/imported-from: "quay.io/rh-aiservices-bu/fedaura-codeserver:1.5"
      from:
        kind: DockerImage
        name: "quay.io/rh-aiservices-bu/fedaura-codeserver:1.5"
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source
