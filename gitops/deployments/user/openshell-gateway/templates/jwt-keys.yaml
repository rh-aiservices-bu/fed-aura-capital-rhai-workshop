{{- if .Values.jwtKeys.enabled }}
{{- $ns := include "workshop.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-jwt-init
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    argocd.argoproj.io/hook: PreSync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-jwt-init
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    argocd.argoproj.io/hook: PreSync
rules:
  # Narrow on purpose: this may only touch its own secret, by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
    resourceNames: ["{{ .Values.jwtKeys.secretName }}"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-jwt-init
  namespace: {{ $ns }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    argocd.argoproj.io/hook: PreSync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-jwt-init
subjects:
  - kind: ServiceAccount
    name: openshell-jwt-init
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-jwt-init
  namespace: {{ $ns }}
  annotations:
    # Must exist before the gateway starts, and must never run concurrently with
    # itself - the signing key may only be generated once per namespace.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  parallelism: 1
  completions: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: openshell-jwt-init
      containers:
        - name: jwt-init
          image: {{ .Values.jwtKeys.image }}
          env:
            - name: SECRET
              value: {{ .Values.jwtKeys.secretName | quote }}
            - name: NS
              value: {{ $ns | quote }}
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail
              # Idempotent: an existing keypair is never regenerated, because
              # rotating it invalidates every live sandbox token.
              if oc get secret "$SECRET" -n "$NS" >/dev/null 2>&1; then
                echo "secret $SECRET already exists - leaving it alone"
                exit 0
              fi
              echo "generating an Ed25519 signing keypair"
              cd /tmp
              openssl genpkey -algorithm ed25519 -out signing.pem || exit 1
              openssl pkey -in signing.pem -pubout -out public.pem || exit 1
              # kid = base64url(sha256(public key DER)), matching the gateway's format
              openssl pkey -pubin -in public.pem -outform DER -out public.der || exit 1
              KID="$(openssl dgst -sha256 -binary public.der \
                     | base64 | tr '+/' '-_' | tr -d '=\n')"
              printf '%s' "$KID" > kid
              for i in 1 2 3 4 5; do
                oc create secret generic "$SECRET" -n "$NS" \
                  --from-file=signing.pem=signing.pem \
                  --from-file=public.pem=public.pem \
                  --from-file=kid=kid && exit 0
                # Lost a race with a concurrent run: that is a success, not a failure.
                if oc get secret "$SECRET" -n "$NS" >/dev/null 2>&1; then
                  echo "secret created concurrently - accepting it"
                  exit 0
                fi
                echo "  create attempt $i failed, retrying"; sleep $((i*3))
              done
              echo "FATAL: could not create $SECRET"; exit 1
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
