{{- if and .Values.users.enabled .Values.users.ogx.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-ogx
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: ogx-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        path: {{ include "bootstrap.path" (dict "ctx" . "chart" "user/ogx") }}
        helm:
          values: |
            username: {{ `{{ user }}` }}
            namespacePrefix: {{ .Values.user.namespacePrefix }}
            remotellm:
              enabled: {{ .Values.remotellm.enabled }}
              url: "{{ .Values.remotellm.url }}"
              id: "{{ .Values.remotellm.id }}"
              apiToken: "{{ .Values.remotellm.apiToken }}"
            tinyllama:
              enabled: {{ .Values.admin.llmd.enabled }}
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
{{- end }}
