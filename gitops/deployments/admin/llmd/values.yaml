# Prerequisites:
#   - cert-manager configured with an ingress certificate
#   - Secret 'cert-manager-ingress-cert' present in openshift-ingress
#
# NOTE: the dashboard flag 'llmGatewayField' is owned by the admin/dashboard-config
# chart, so the standalone patch from templates/admin/llmd is deliberately omitted
# here to avoid two Applications fighting over OdhDashboardConfig.
namespace: llm
dashboardNamespace: redhat-ods-applications
gateway:
  enabled: true
  name: openshift-ai-inference
  namespace: openshift-ingress
  gatewayClassName: openshift-default
  certificateSecret: cert-manager-ingress-cert
serviceConfig:
  enabled: true
  name: vllm-cpu-x86-llminferenceserviceconfig-single-node
  image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:a1ec87fc11e84aff94af69fe92827d7a708b78792bce052615fb3c4bf1fc0bef
  runtimeVersion: 0.24.0+rhaiv.9
tinyllama:
  enabled: true
  uri: oci://quay.io/rh-aiservices-bu/tinyllama:1.0
  image: registry.redhat.io/rhaiis/vllm-cpu-rhel9@sha256:f05e773647dddd37ec6c2215cb14bec87e4ab5a7d37f2e110d16cd92355427d3
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 8Gi
