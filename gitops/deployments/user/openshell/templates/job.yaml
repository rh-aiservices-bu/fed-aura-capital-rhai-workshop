{{- $ns := include "workshop.namespace" . }}
apiVersion: batch/v1
kind: Job
metadata:
  # Name carries the provision version, so bumping it creates a new Job rather
  # than colliding with the immutable spec of a completed one.
  name: openshell-provision-v{{ .Values.sandbox.provisionVersion }}
  namespace: {{ $ns }}
  annotations:
    # Re-run when the script or the version changes, not on every sync.
    checksum/provision: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    argocd.argoproj.io/sync-options: Replace=false
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  # One provisioner at a time per user - two concurrent runs against the same
  # gateway are the obvious race, and this removes it.
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-provision
    spec:
      restartPolicy: Never
      serviceAccountName: openshell-provision
      containers:
        - name: provision
          image: {{ .Values.job.image }}
          command: ["/bin/bash", "/scripts/provision.sh"]
          env:
            - name: SANDBOX_NAME
              value: {{ .Values.sandbox.name | quote }}
            - name: PROVISION_VERSION
              value: {{ .Values.sandbox.provisionVersion | quote }}
            {{- if .Values.sandbox.image }}
            - name: SANDBOX_IMAGE
              value: {{ .Values.sandbox.image | quote }}
            {{- end }}
            - name: GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            - name: GATEWAY_ENDPOINT
              value: {{ .Values.gateway.endpoint | quote }}
            - name: OCP_APPS_DOMAIN
              value: {{ .Values.ocpAppsDomain | quote }}
            - name: HOME
              value: /tmp
            {{- if .Values.mlflow.enabled }}
            - name: MLFLOW_EXPERIMENT
              value: {{ .Values.mlflow.experiment | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: openshell-provision-llm
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.job.resources | indent 12 }}
      volumes:
        - name: scripts
          configMap:
            name: openshell-provision
        - name: tmp
          emptyDir: {}
