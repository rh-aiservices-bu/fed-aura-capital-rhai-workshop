{{- if and .Values.users.enabled .Values.users.openshell.enabled }}
---
# Gateway (wave 9). The upstream chart creates cluster-scoped objects named after
# the fullname with no way to disable them, so every per-user release must use a
# distinct fullname. Four values move together and must not drift:
#   openshell.fullnameOverride  openshell-<user>
#   jwtKeys.secretName          openshell-<user>-jwt-keys    (the gateway mounts <fullname>-jwt-keys)
#   scc.serviceAccount          openshell-<user>-sandbox     (SCC admission refuses the sandbox pod otherwise)
#   gateway.endpoint            http://openshell-<user>:8080 (used by the sandbox ApplicationSet below)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-openshell-gateway
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: openshell-gateway-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        path: {{ include "bootstrap.path" (dict "ctx" . "chart" "user/openshell-gateway") }}
        helm:
          values: |
            username: {{ `{{ user }}` }}
            namespacePrefix: {{ .Values.user.namespacePrefix }}
            jwtKeys:
              secretName: openshell-{{ `{{ user }}` }}-jwt-keys
            scc:
              serviceAccount: openshell-{{ `{{ user }}` }}-sandbox
            openshell:
              fullnameOverride: openshell-{{ `{{ user }}` }}
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
# Sandbox provisioning (wave 10). Runs after the gateway is up; the Job is
# idempotent, so a re-sync converges rather than recreating.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-openshell-sandbox
  namespace: {{ .Values.bootstrap.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  generators:
    - list:
        elements:
{{- include "bootstrap.userElements" . }}
  template:
    metadata:
      name: openshell-sandbox-{{ `{{ user }}` }}
      namespace: {{ .Values.bootstrap.argoNamespace }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.bootstrap.project }}
      source:
        repoURL: {{ .Values.bootstrap.repoURL }}
        targetRevision: {{ .Values.bootstrap.targetRevision }}
        path: {{ include "bootstrap.path" (dict "ctx" . "chart" "user/openshell") }}
        helm:
          values: |
            username: {{ `{{ user }}` }}
            namespacePrefix: {{ .Values.user.namespacePrefix }}
            ocpAppsDomain: {{ .Values.deployer.domain }}
            gateway:
              # Stable alias, not the per-user upstream Service name.
              endpoint: http://openshell:8080
            sandbox:
              name: {{ .Values.users.openshell.sandboxName }}
            llm:
              baseUrl: "{{ .Values.remotellm.url }}"
              apiKey: "{{ .Values.remotellm.apiToken }}"
              model: "{{ .Values.remotellm.id }}"
      destination:
        name: in-cluster
        namespace: {{ .Values.user.namespacePrefix }}-{{ `{{ user }}` }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
{{- end }}
