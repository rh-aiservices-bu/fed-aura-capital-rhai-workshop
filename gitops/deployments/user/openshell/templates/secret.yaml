{{- $ns := include "workshop.namespace" . }}
apiVersion: v1
kind: Secret
metadata:
  name: openshell-provision-llm
  namespace: {{ $ns }}
type: Opaque
stringData:
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
