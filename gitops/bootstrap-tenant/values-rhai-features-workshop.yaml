# Overlay for when this tree is hosted in rhpds/rhai-features-workshop under
# automation/gitops/. Apply with:
#   helm upgrade --install bootstrap-tenant automation/gitops/bootstrap-tenant \
#     -n openshift-gitops --create-namespace \
#     -f automation/gitops/bootstrap-tenant/values-rhai-features-workshop.yaml
bootstrap:
  repoURL: https://github.com/rhpds/rhai-features-workshop
  targetRevision: main
  pathPrefix: automation/gitops

components:
  mortgageAi:
    # mortgage-ai chart location inside that repo.
    chartPath: automation/gitops/deployments/mortgage-ai
