<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Fed Aura Capital architecture with the models layer highlighted</title>
  <desc id="desc">The complete Lenora AI platform is dimmed except for the self-hosted models layer, which is highlighted as the focus of Module 1.</desc>
  <defs>
    <mask id="spotlight-mask">
      <rect width="1400" height="850" fill="white"/>
      <rect x="56" y="478" width="394" height="220" rx="24" fill="black"/>
    </mask>
    <filter id="focus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ee0000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <image href="fed-aura-platform-architecture.svg" xlink:href="fed-aura-platform-architecture.svg" width="1400" height="850"/>

  <!-- Dim the full platform while leaving the Models group unobscured. -->
  <rect width="1400" height="850" fill="#151515" opacity="0.56" mask="url(#spotlight-mask)"/>

  <!-- The focus frame aligns with the Models group in the source architecture. -->
  <g id="models-focus">
    <rect x="58" y="480" width="390" height="216" rx="22" fill="none" stroke="#ee0000" stroke-width="7" filter="url(#focus-shadow)"/>
    <rect x="70" y="456" width="258" height="42" rx="21" fill="#ee0000"/>
    <text x="199" y="483" text-anchor="middle" font-family="RedHatText, 'Red Hat Text', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">MODULE 1 FOCUS · MODELS</text>
  </g>
</svg>
