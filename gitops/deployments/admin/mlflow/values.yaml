storage:
  size: 10Gi
  accessMode: ReadWriteOnce
backendStoreUri: "sqlite:////mlflow/mlflow.db"
artifactsDestination: "file:///mlflow/artifacts"
# Workspaces are auto-discovered from namespaces carrying this label, which is
# what wksp-userN namespaces get from the user/workspace chart.
workspaceLabel:
  key: opendatahub.io/dashboard
  value: "true"
