# Per-user OpenShell gateway.
#
# Replaces templates/user/openshell/install.sh. Everything that script did with
# imperative oc commands is expressed declaratively here, except the JWT signing
# keypair, which needs generating once per namespace and is handled by an
# idempotent hook Job.
username: user1
namespacePrefix: wksp

# Cluster-scoped prerequisite: the Agent Sandbox operator must already be
# installed. That is global, so it belongs to the admin phase, not here.

# Stable endpoint for the workshop instructions. Without this, the endpoint is
# openshell-<user>:8080 and every instruction has to be parameterised.
serviceAlias:
  enabled: true
  name: openshell
  # The upstream chart labels its pods app.kubernetes.io/name=openshell; the
  # instance label is taken from the release name automatically.
  selectorName: openshell

route:
  enabled: true
  name: openshell-gw

jwtKeys:
  # Generated once per namespace if the secret is absent. Never regenerated,
  # because rotating the signing key invalidates every live sandbox token.
  enabled: true
  # Must track openshell.fullnameOverride: the gateway mounts <fullname>-jwt-keys.
  secretName: openshell-user1-jwt-keys
  image: quay.io/rh-aiservices-bu/fedaura-codeserver:1.3

scc:
  # `oc adm policy add-scc-to-user privileged -z <sa>` is just a RoleBinding to
  # this ClusterRole, so it is declarative. The SA name follows the fullname
  # (<fullname>-sandbox); if it does not match, sandbox pods are refused by SCC
  # admission and the Sandbox object sits in Provisioning with no pod at all.
  enabled: true
  serviceAccount: openshell-user1-sandbox

# Values passed through to the upstream chart.
openshell:
  # MUST be unique per user. The upstream chart creates a cluster-scoped
  # ClusterRole and ClusterRoleBinding named <fullname>-node-reader with no way to
  # disable them, so a shared fullname makes the first namespace claim those
  # objects and every later namespace fail to install. The ApplicationSet sets
  # this to openshell-<user>, and gateway.endpoint below must match.
  fullnameOverride: openshell-user1
  pkiInitJob:
    enabled: false
  podSecurityContext:
    fsGroup: null
  securityContext:
    runAsUser: null
  server:
    disableTls: true
    auth:
      # The workshop gateway is reached only from inside the user's own
      # namespace, so CLI requests are unauthenticated by design.
      allowUnauthenticatedUsers: true
